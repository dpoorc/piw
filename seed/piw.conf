# piw manifest
#
# One entry per line. `#` starts a comment at the start of a line or after
# whitespace. Blank lines are ignored. Repeated sections merge.
#
# [layers] declares build-time image additions:
#   apt:<name> [<name>...]   Debian packages, installed in one step
#   run:<name>               a layer directory at .local/layers/<name>/
#
# [pi] declares pi packages, installed with `pi install`:
#   npm:<name>[@<version>]
#   git:<url>[@<ref>]

[layers]
# apt:zsh gdb
# run:my-setup

[pi]
# npm:pi-intercom
